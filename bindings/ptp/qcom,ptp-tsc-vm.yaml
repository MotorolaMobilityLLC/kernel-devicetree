%YAML 1.2
---
$id: http://devicetree.org/schemas/ptp/qcom,ptp-tsc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. Timestamp Counter(TSC) based PTP clock for VM

maintainers:
 - Taniya Das <quic_tdas@quicinc.com>
 - Satya Priya Kakitapalli <quic_skakitap@quicinc.com>

description:
  TSC module is a timestamp generator, which runs a 64 bit counter for
  system timekeeping.

properties:
  compatible:
    const: "qcom,tsc-vm"

    reg:
      maxItems: 1

    reg-names:
      items:
        - const: tsc

    qcom,tsc-nsec-update:
      description:
        Indicates the TSC counters have values in nanoseconds, rather than
        in secs and nanoseconds.
      type: boolean

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    tsc@1c81000 {
      compatible = "qcom,tsc-vm";
      reg = <0x01c81000 0x1000>;
      reg-names = "tsc";
      qcom,tsc-nsec-update;
    };
